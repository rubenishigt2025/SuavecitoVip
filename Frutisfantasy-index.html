<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Premium Profesional 4:3</title>
    
    <!-- Script de Publicidad Integrado -->
    <script src="https://pl29563770.effectivecpmnetwork.com/55/58/60/5558606f5e01758c3d0208faa411e5f8.js"></script>

    <style>
        /* Paleta de colores oscuros premium */
        :root {
            --bg-color: #08080a;
            --card-bg: #121216;
            --accent-color: #a855f7; /* Púrpura neón */
            --accent-glow: rgba(168, 85, 247, 0.4);
            --discord-color: #5865F2;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-wrapper {
            width: 100%;
            max-width: 580px; /* Tamaño perfecto para relación 4:3 */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Contenedor del Reproductor con relación de aspecto estricta 4:3 */
        .player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000000;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Capas superpuestas (Overlays) de acción requerida */
        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 8, 10, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.4s ease;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Botón de Reproducción Principal Gigante */
        .play-now-button {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 800;
            padding: 18px 36px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 24px var(--accent-glow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-now-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px var(--accent-glow);
        }

        .play-now-button svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Botón Discord Estilizado */
        .btn-discord {
            background-color: var(--discord-color);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-discord:hover {
            background-color: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(88, 101, 242, 0.5);
        }

        .btn-discord svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Estilo para los anuncios en curso */
        .ad-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ff0077;
            text-shadow: 0 0 10px rgba(255, 0, 119, 0.4);
        }

        .ad-desc {
            font-size: 0.95rem;
            color: #a1a1aa;
            margin-bottom: 20px;
        }

        /* Ocultar elementos visuales */
        .hidden {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Bloque del Reproductor -->
        <div class="player-container" oncontextmenu="return false;">
            
            <!-- Capa Inicial: "Reproducir Ahora" -->
            <div id="start-overlay" class="video-overlay">
                <button class="play-now-button" onclick="actionStartPlay()">
                    <!-- Icono de Play -->
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    Reproducir Ahora
                </button>
            </div>

            <!-- Capa Intermedia: "Anuncio de Continuación" (Evita bloqueos del navegador al simular clics nativos) -->
            <div id="ad-overlay" class="video-overlay hidden">
                <div class="ad-title">Siguiente segmento listo</div>
                <div class="ad-desc">Haz clic en el botón para continuar con la reproducción sin límites.</div>
                <button class="play-now-button" onclick="actionResumePlay()">
                    <!-- Icono de Play -->
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    Continuar Viendo
                </button>
            </div>

            <!-- Reproductor Seguro 4:3 sin descargas nativas -->
            <video id="video-player" controlsList="nodownload noplaybackrate" disablePictureInPicture nodownload>
                <source src="https://files.catbox.moe/1ip8ye.mp4" type="video/mp4">
                Tu navegador no soporta el formato de este video.
            </video>

        </div>

        <!-- Botón de Discord Únicamente (Sin botones de descarga) -->
        <a href="https://discord.gg/8c7Bry3uj" target="_blank" class="btn-discord">
            <!-- Icono Oficial Discord SVG -->
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,68.43,68.43,0,0,1-10.5-5c.9-.65,1.76-1.34,2.58-2a75.58,75.58,0,0,0,72.9,0c.82.71,1.68,1.4,2.58,2a68.45,68.45,0,0,1-10.5,5,77.7,77.7,0,0,0,6.63,10.85,105.73,105.73,0,0,0,31-18.83C129.87,50.12,123.7,27.31,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/>
            </svg>
            Unirse al Servidor de Discord
        </a>
    </div>

    <!-- Gestión Profesional de Video y Flujo de Anuncios -->
    <script>
        const video = document.getElementById('video-player');
        const startOverlay = document.getElementById('start-overlay');
        const adOverlay = document.getElementById('ad-overlay');
        
        // Enlace de monetización
        const linkMonetizacion = "https://www.effectivegatecpm.com/gug4t17dru?key=2d7d9a881dfa0648fd0d7040624155ef";
        
        let conteoAnuncios = 0;
        const totalAnunciosMaximo = 3;
        const intervaloSegundos = 15;
        let adTracker;

        // Desactivar funciones adicionales de pulsado prolongado para evitar descargas en móviles
        video.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, {passive: false});

        // 1. Primer clic: Abre anuncio obligatorio y comienza reproducción
        function actionStartPlay() {
            window.open(linkMonetizacion, '_blank');
            startOverlay.classList.add('hidden');
            video.play();
            iniciarCicloPublicidad();
        }

        // 2. Controladores del bucle de anuncios cada 15s (Máximo 3)
        function iniciarCicloPublicidad() {
            adTracker = setInterval(() => {
                if (conteoAnuncios < totalAnunciosMaximo) {
                    if (!video.paused && !video.ended) {
                        // Pausar y exigir interacción del usuario para asegurar bypass del bloqueador de ventanas
                        video.pause();
                        adOverlay.classList.remove('hidden');
                    }
                } else {
                    clearInterval(adTracker);
                }
            }, intervaloSegundos * 1000);
        }

        // 3. Continuar reproducción tras hacer clic en la pausa publicitaria intermedia
        function actionResumePlay() {
            window.open(linkMonetizacion, '_blank');
            conteoAnuncios++;
            adOverlay.classList.add('hidden');
            video.play();
        }
    </script>

</body>
</html>
