<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video Premium</title>
    
    <!-- Script publicitario del cliente (Antibloqueos / Red de CPM) -->
    <script src="https://pl29563770.effectivecpmnetwork.com/55/58/60/5558606f5e01758c3d0208faa411e5f8.js"></script>

    <style>
        /* Diseño cinemático oscuro y elegante */
        body {
            background-color: #030303;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-wrapper {
            width: 100%;
            max-width: 640px; /* Tamaño perfecto para relación 4:3 */
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }

        /* Contenedor del video con relación de aspecto 4:3 */
        .player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 65, 108, 0.05);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantiene la proporción del video perfectamente */
            background-color: #000;
        }

        /* Pantallas de Superposición (Overlays) */
        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.4s ease;
            text-align: center;
            padding: 20px;
        }

        /* Estilo para botón 'Reproducir Ahora' y anuncios */
        .action-button {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 800;
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 10px 25px rgba(255, 65, 108, 0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .action-button:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 30px rgba(255, 65, 108, 0.7);
        }

        .action-button:active {
            transform: scale(0.98);
        }

        .overlay-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Botón de Discord Premium */
        .btn-discord {
            background-color: #5865F2;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 16px 30px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-discord:hover {
            background-color: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(88, 101, 242, 0.45);
        }

        /* Icono SVG */
        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Ocultar elementos visuales */
        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- Reproductor de Video Profesional (4:3) -->
    <div class="player-container" oncontextmenu="return false;">
        
        <!-- Pantalla 1: Reproducir Ahora (Filtro Inicial Obligatorio) -->
        <div id="start-overlay" class="video-overlay">
            <div class="overlay-title">Video Disponible en Alta Definición</div>
            <button class="action-button" onclick="lanzarReproduccion()">
                <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                Reproducir Ahora
            </button>
        </div>

        <!-- Pantalla 2: Interrupción de Anuncio (Antibloqueo de Popups) -->
        <div id="ad-overlay" class="video-overlay hidden">
            <div class="overlay-title">Anuncio Requerido para Desbloquear Continuación</div>
            <button class="action-button" onclick="saltarAnuncioInteractivos()">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                Haga Clic para Continuar
            </button>
        </div>

        <!-- Elemento de Video Seguro -->
        <!-- ControlsList="nodownload" y disablePictureInPicture quitan las descargas del sistema -->
        <video id="premiumVideo" controlsList="nodownload noplaybackrate" disablePictureInPicture>
            <source src="https://files.catbox.moe/a6433c.mp4" type="video/mp4">
            Tu navegador no admite este reproductor avanzado de video.
        </video>
    </div>

    <!-- Botón de Discord (Ubicado directamente abajo del video sin botón de descarga) -->
    <a href="https://discord.gg/8c7Bry3uj" target="_blank" class="btn-discord">
        <svg class="icon" viewBox="0 0 127.14 96.36">
            <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,68.43,68.43,0,0,1-10.45-5c.87-.64,1.72-1.33,2.53-2a75.69,75.69,0,0,0,93,0c.81.71,1.66,1.4,2.53,2a68.51,68.51,0,0,1-10.45,5,78.29,78.29,0,0,0,6.63,10.85,105.73,105.73,0,0,0,31-18.83C129,54.65,122.94,31.58,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/>
        </svg>
        UNIRSE A DISCORD
    </a>
</div>

<script>
    const video = document.getElementById('premiumVideo');
    const startOverlay = document.getElementById('start-overlay');
    const adOverlay = document.getElementById('ad-overlay');
    
    // Enlace de monetización obligatorio
    const enlaceAnuncio = "https://www.effectivegatecpm.com/gug4t17dru?key=2d7d9a881dfa0648fd0d7040624155ef";
    
    // Variables de control de anuncios
    let contadorAnuncios = 0;
    const limiteAnuncios = 3;
    const intervaloSegundos = 15;
    let temporizadorAnuncio = null;

    // Acción Inicial: Reproducir Ahora
    function lanzarReproduccion() {
        // Ejecuta la ventana del anuncio
        window.open(enlaceAnuncio, '_blank');
        
        // Quita la pantalla inicial
        startOverlay.classList.add('hidden');
        
        // Activa la reproducción nativa
        video.play();
        
        // Inicia el monitoreo del tiempo del video
        iniciarMonitoreoAnuncios();
    }

    // Monitoreo de tiempo personalizado para interrumpir y forzar interacción publicitaria
    function iniciarMonitoreoAnuncios() {
        if (temporizadorAnuncio) clearInterval(temporizadorAnuncio);
        
        temporizadorAnuncio = setInterval(() => {
            // Si el video está pausado o ya completó la cuota de anuncios, no hace nada
            if (video.paused || video.ended) return;

            if (contadorAnuncios < limiteAnuncios) {
                // Pausa el video para exigir acción del usuario (Antibloqueo)
                video.pause();
                
                // Muestra la pantalla del anuncio
                adOverlay.classList.remove('hidden');
            } else {
                // Si ya se mostraron los 3 anuncios requeridos, detenemos el intervalo
                clearInterval(temporizadorAnuncio);
            }
        }, intervaloSegundos * 1000);
    }

    // Acción Interactiva para continuar viendo tras la pausa del anuncio
    function saltarAnuncioInteractivos() {
        // Registra el anuncio en el contador
        contadorAnuncios++;
        
        // Abre obligatoriamente el enlace del anuncio en pestaña separada
        window.open(enlaceAnuncio, '_blank');
        
        // Oculta la interrupción
        adOverlay.classList.add('hidden');
        
        // Reanuda el video
        video.play();
    }

    // Seguridad Adicional: Evitar el bypass a través de controles nativos de pausa/play
    video.addEventListener('play', () => {
        // Aseguramos que si las pantallas de bloqueo están visibles, el video no pueda reproducirse por detrás
        if (!startOverlay.classList.contains('hidden') || !adOverlay.classList.contains('hidden')) {
            video.pause();
        }
    });
</script>

</body>
</html>
